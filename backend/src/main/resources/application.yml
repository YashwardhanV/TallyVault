server:
  port: 8080

spring:
  application:
    name: tallyvault
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tallyvault}
    username: ${DB_USERNAME:tallyvault}
    password: ${DB_PASSWORD:tallyvault}
    hikari:
      maximum-pool-size: 20
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

tallyvault:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-123456}
    expiration-minutes: 120
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  demo-data-enabled: ${DEMO_DATA_ENABLED:true}
